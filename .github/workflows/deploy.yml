name: Deploy to GitHub Pages

on:
  push:
    # Guarded below so this only deploys from whatever the repository's default
    # branch happens to be — the repo was bootstrapped without a `main`.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same gates as CI — deploy only ships verified data.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run validate:questions
      - run: npm run check:duplicates

      - name: Build
        # Served from https://<owner>.github.io/<repo>/
        run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # enablement:true lets the workflow turn Pages on itself (source = Actions).
      # Without it the first run fails with "Get Pages site failed ... Not Found"
      # until someone flips the switch in Settings → Pages by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
