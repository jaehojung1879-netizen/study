name: Law update check

# Statutes change between exam cycles. This runs the detector on a schedule and
# opens an issue when something needs a human to compare against the primary
# source — it never edits questions on its own.
on:
  schedule:
    - cron: '0 21 * * 0' # 매주 월요일 06:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run detector
        id: detect
        run: |
          npm run check:law-updates 2>&1 | tee law-report.txt
          if grep -qE '^\s+[✗⚠]' law-report.txt; then
            echo "needs_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a review issue
        if: steps.detect.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('law-report.txt', 'utf8');
            const title = '법령 재확인 필요';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'law-check',
            });
            const body = [
              '자동 감지 결과 아래 항목의 원문 확인이 필요합니다.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '확인 절차:',
              '1. 국가법령정보센터(https://www.law.go.kr)에서 해당 법령의 현행 버전을 확인한다.',
              '2. `data/exams/<examId>/law-sources.json`의 `version`과 `checkedAt`을 갱신한다.',
              '3. 조문 내용이 바뀌었다면 관련 문항의 `lawAsOf`를 갱신하고, 필요하면 `needsReview`를 설정한다.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['law-check'],
              });
            }
