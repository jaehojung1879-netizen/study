name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Validate · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and flow tests
        run: npm run test

      # A question bank that fails validation must never reach GitHub Pages (§33).
      - name: Validate question bank
        run: npm run validate:questions

      - name: Check for duplicate questions
        run: npm run check:duplicates

      - name: Build
        run: npx vite build
